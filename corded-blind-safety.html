  <sc-if value="{{ chatOpen }}" hint-placeholder-val="{{ false }}">

        </div>

        </sc-for>
      </div>
      <div style="padding: 10px 12px 0; display: flex; gap: 6px; flex-wrap: wrap; background: #FFFFFF">

          <button type="button" onClick="{{ q.ask }}" style="font: inherit; font-size: 12px; padding: 6px 10px; border: 1px solid #D9D3C4; border-radius: 999px; background: #FFFFFF; color: #2E2E2E; cursor: pointer">{{ q.label }}</button>

<script src="assets/runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menuOpen: false, open: {}, chatOpen: false, chatText: '', chatLog: [{ from: 'bot', text: 'Hi, I\'m the Ultron help assistant. Ask me about our checks, pricing, bookings or Victorian rental requirements.' }] };
  }
  mapFaq(items, key) {
    const open = this.state.open;
    return items.map((f, i) => {
      const id = key + '-' + i;
      const isOpen = !!open[id];
      return {
        q: f.q, a: f.a, open: isOpen,
        expanded: isOpen ? 'true' : 'false',
        sign: isOpen ? '−' : '+',
        toggle: () => this.setState({ open: Object.assign({}, open, { [id]: !isOpen }) })
      };
    });
  }
  chatKB() {
    return [
      { k: ['price', 'cost', 'how much', 'quote', 'pricing', 'fee', 'charge'], a: 'Prices depend on which checks you need and how many properties you have. Bundling checks costs less than booking each one separately. Our pricing calculator gives you an instant estimate.', l: ['Open the pricing calculator', 'pricing.html'] },
      { k: ['book', 'booking', 'schedule', 'appointment', 'arrange'], a: 'You can book online in a few minutes. Tell us the property and the checks you need, and we\'ll confirm a time and coordinate access.', l: ['Request a quote or booking', 'get-a-quote.html'] },
      { k: ['which check', 'what check', 'need', 'required', 'requirement', 'law', 'legal', 'compliance', 'comply'], w: 0.5, a: 'Victorian rentals need gas and electrical safety checks every two years and smoke alarm testing every 12 months, and must meet the rental minimum standards, including anchored blind cords.', l: ['See minimum standards', 'minimum-standards-check.html'] },
      { k: ['electric', 'wiring', 'switchboard', 'power point'], a: 'Electrical safety checks are required every two years for Victorian rentals and must be done by a licensed electrician.', l: ['Electrical Check', 'electrical-check.html'] },
      { k: ['gas', 'carbon monoxide', 'heater', 'cooktop', 'hot water'], a: 'Gas safety checks are required every two years and include leak and carbon monoxide testing of applicable appliances.', l: ['Gas Check', 'gas-check.html'] },
      { k: ['smoke', 'alarm', 'detector'], a: 'Smoke alarms in Victorian rentals must be tested at least every 12 months. We test every alarm and document the results.', l: ['Smoke Alarm Check', 'smoke-alarm-check.html'] },
      { k: ['blind', 'cord', 'curtain', 'window covering'], a: 'Since 1 December 2025, corded blinds and curtains in Victorian rentals must have anchored cords. We check them and can fix minor issues on the spot.', l: ['Corded Blind Safety', 'corded-blind-safety.html'] },
      { k: ['water', 'shower', 'tap', 'toilet', 'leak'], a: 'Showerheads in Victorian rentals need at least a 3-star water efficiency rating. Our water efficiency check also looks for leaks.', l: ['Water Efficiency', 'water-efficiency.html'] },
      { k: ['fire', 'aesmr', 'sprinkler', 'extinguisher', 'emergency light', 'exit'], a: 'Our essential fire safety service covers fire systems, emergency lighting and exits, plus Annual Essential Safety Measures Report support.', l: ['Essential Fire Safety', 'essential-fire-safety.html'] },
      { k: ['rcd', 'safety switch', 'trip'], a: 'Safety switches (RCDs) protect against electric shock. We test each one and record the results.', l: ['Safety Switch Testing', 'safety-switch-testing.html'] },
      { k: ['minimum standard', 'mould', 'heating', 'lock', 'ventilation'], a: 'Our minimum standards check assesses your rental against Victoria\'s 15 minimum standards categories, with a clear report of anything needing attention.', l: ['Minimum Standards Check', 'minimum-standards-check.html'] },
      { k: ['area', 'suburb', 'where', 'location', 'service area', 'melbourne', 'victoria'], a: 'We service rental properties across Victoria. Enter your suburb when you request a quote and we\'ll confirm availability.', l: ['Check availability', 'get-a-quote.html'] },
      { k: ['report', 'document', 'certificate', 'record'], a: 'After every visit you receive a digital report showing what was checked, the results and any issues found.', l: null },
      { k: ['tenant', 'access', 'key', 'present', 'home'], a: 'You don\'t need to be there. We can arrange access with your tenants and send the report electronically.', l: null },
      { k: ['cancel', 'reschedule', 'change'], a: 'No problem. Let us know as early as possible and we\'ll find a new time that suits you and your tenants.', l: null },
      { k: ['pay', 'payment', 'invoice', 'card'], a: 'You can pay online when you book, or we can invoice you or your agency after the service.', l: null },
      { k: ['portfolio', 'agency', 'property manager', 'multiple'], a: 'We handle single properties and whole portfolios, keeping every check and report organised in one place.', l: ['About Ultron', 'about.html'] },
      { k: ['human', 'person', 'call', 'phone', 'talk', 'contact', 'speak', 'email'], a: 'Happy to connect you with our team. Call [PHONE] or send us your details and we\'ll be in touch.', l: ['Get in touch', 'get-a-quote.html'] },
      { k: ['hi', 'hello', 'hey', 'thanks', 'thank you'], a: 'Hello! What can I help you with today?', l: null }
    ];
  }
  chatReply(q) {
    const t = ' ' + q.toLowerCase().replace(/[^a-z0-9 ]/g, ' ') + ' ';
    let best = null, score = 0;
    this.chatKB().forEach((e) => {
      const s = (e.w || 1) * e.k.reduce((n, k) => n + (t.indexOf(k.length <= 3 ? ' ' + k + ' ' : k) !== -1 ? k.length + 3 : 0), 0);
      if (s > score) { score = s; best = e; }
    });
    if (!best) return { from: 'bot', text: 'Sorry, I\'m not sure about that one. Our team can help: call [PHONE] or send us your details.', link: ['Get in touch', 'get-a-quote.html'] };
    return { from: 'bot', text: best.a, link: best.l };
  }
  chatAsk(q) {
    q = (q || '').trim();
    if (!q) return;
    const log = this.state.chatLog.concat([{ from: 'me', text: q }, this.chatReply(q)]);
    this.setState({ chatLog: log, chatText: '' });
  }
  chatVals() {
    const st = this.state;
    const chips = ['How much does it cost?', 'Which checks do I need?', 'Book a check', 'Talk to a person'];
    return {
      chatOpen: st.chatOpen, chatOpenStr: st.chatOpen ? 'true' : 'false',
      chatFabLabel: st.chatOpen ? 'Close' : 'Need help?',
      toggleChat: () => this.setState({ chatOpen: !st.chatOpen }),
      chatText: st.chatText,
      chatType: (e) => this.setState({ chatText: (e && e.target ? e.target.value : '').slice(0, 300) }),
      chatKey: (e) => { if (e && e.key === 'Enter') { e.preventDefault && e.preventDefault(); this.chatAsk(st.chatText); } },
      chatSend: () => this.chatAsk(st.chatText),
      chatChips: chips.map((label) => ({ label, ask: () => this.chatAsk(label) })),
      chatMsgs: st.chatLog.slice().reverse().map((m) => ({
        text: m.text, align: m.from === 'me' ? 'flex-end' : 'flex-start',
        bg: m.from === 'me' ? '#2E2E2E' : '#FFFFFF', fg: m.from === 'me' ? '#FFFFFF' : '#2E2E2E',
        hasLink: !!m.link, label: m.link ? m.link[0] : '', href: m.link ? m.link[1] : '#'
      }))
    };
  }
  renderVals() {
    return {
      menuOpen: this.state.menuOpen,
      menuOpenStr: this.state.menuOpen ? 'true' : 'false',
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen }),
      ...this.chatVals(),
      faqs: this.mapFaq([{"q": "Is this a legal requirement?", "a": "Yes. Since 1 December 2025, corded internal window coverings in Victorian rentals must have anchored cords."}, {"q": "Do you fix problems on the spot?", "a": "Minor issues, such as missing cleats or cord guides, can be fixed during the service."}, {"q": "Which coverings are checked?", "a": "Corded internal blinds and curtains throughout the property."}], 'faqs')
    };
  }
}
mountPage(Component, {});
</script>
